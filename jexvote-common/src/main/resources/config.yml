# ╔═══════════════════════════════════════════════════════════════╗
# ║                    JExVote Configuration                      ║
# ╠═══════════════════════════════════════════════════════════════╣
# ║  All-in-one vote listener with a built-in Votifier server     ║
# ║  (v1 RSA + v2 token). You do not need NuVotifier.             ║
# ║                                                               ║
# ║  Quick start:                                                 ║
# ║   1. Open the Votifier port below in your firewall / panel.   ║
# ║   2. Add your vote sites in sites.yml.                        ║
# ║   3. Run /jexvote key and paste the key on each vote site.    ║
# ║   4. Run /jexvote info to check that everything is running.   ║
# ║   5. Test with /jexvote fakevote <player>.                    ║
# ║  Rewards live in rewards.yml. Reload with /jexvote reload.    ║
# ╚═══════════════════════════════════════════════════════════════╝

# ── Features ────────────────────────────────────────────────────
# Switch whole features on or off. A feature that is off is hidden
# from /vote, the Bedrock forms and /vote help. The Free edition
# has no shop, vote party or weekend bonus whatever is set here;
# /jexvote info shows what is on and why.
features:
  # Vote streaks: the streak counter, streak milestones (streak-rewards
  # in rewards.yml), Streak Freezes and vote gifts. When off, votes still
  # count and pay their rewards.
  streaks: true
  # Vote shop (/vote shop): players spend vote points on the items in
  # the vote-shop section of rewards.yml. Premium edition only.
  shop: true
  # Top voters menu (/vote top). When off, /vote top prints a chat list.
  leaderboard: true
  # Sounds and titles on votes, streak days and milestones (vote-effects below).
  effects: true

# ── Votifier Server ─────────────────────────────────────────────
# The built-in vote receiver. Works with every vote site that supports
# Votifier or NuVotifier. On a network, run it on the backend that
# should receive the votes (or on each backend with its own port).
votifier:
  # Address to listen on. Empty = all interfaces (0.0.0.0).
  host: ''
  # Port the vote sites send votes to (default 8192). Enter the same
  # port on every vote site and open it in your firewall.
  port: 8192
  # Shared secret for Votifier v2 sites. Leave it empty: a token is
  # created on first start and saved here. /jexvote key shows it.
  token: ''

# ── Broadcast ───────────────────────────────────────────────────
# Chat line "<player> voted on <site>" when a vote arrives.
broadcast:
  # Who sees it:
  #   all    - everyone online, the voter included
  #   others - everyone except the voter
  #   none   - no broadcast
  mode: 'all'
  # Minimum seconds between two broadcasts. Votes inside the window
  # are not announced (they still count). 0 = announce every vote.
  cooldown: 0

# ── Private Message ─────────────────────────────────────────────
# The "Thanks for voting" message sent only to the voter.
private-message:
  enabled: true

# ── Player reminders ────────────────────────────────────────────
# Each player picks in /vote settings whether they want a reminder when
# a vote site is ready again (chat or title), a warning before their
# streak breaks and, with JExDiscord and a linked account, a Discord
# message. These values only set the timing.
reminders:
  # When false, the reminder options show as unavailable in /vote settings.
  enabled: true
  # Seconds between two checks of the online players.
  check-seconds: 60
  # Minimum minutes between two in-game reminders for the same player.
  interval-minutes: 60
  # Warn this many hours before a streak would break.
  streak-warning-hours: 3
  # Minimum minutes between two Discord reminders for the same player.
  discord-interval-minutes: 720

# ── Offline Vote Queue ──────────────────────────────────────────
# A vote from a player who is offline is stored and paid out the next
# time they join, with one summary of everything they got.
offline-vote-queue: true

# ── Vote Streak ─────────────────────────────────────────────────
streak:
  # Hours without a vote before a streak breaks. 36 leaves room for
  # players who vote at different times of the day.
  timeout-hours: 36

  # How streak milestone rewards (streak-rewards in rewards.yml) are paid:
  #   manual - the player claims each milestone in /vote > Streak rewards
  #   auto   - paid the moment the streak reaches the milestone
  claim-mode: 'manual'

  # ── Streak Freeze ─────────────────────────────────────────────
  # A Streak Freeze saves a streak when a player misses a day. It is
  # used up on its own: when a vote arrives after the streak would have
  # broken, the needed freezes are consumed and the streak goes on.
  freeze:
    enabled: true
    # Free freezes every player gets once, when they vote for the first time.
    free-amount: 1
    # Vote points one freeze costs (/vote freeze or the Vote rewards menu).
    cost-points: 5
    # Most freezes a player can own. A player with the permission
    # 'jexvote.freeze.max.<n>' can own up to <n> (the highest wins).
    default-max: 3
    # Hours one freeze covers beyond the normal timeout. A longer gap
    # uses several freezes.
    duration-hours: 24

  # Extra console commands on exact streak days, run on top of the
  # streak-rewards in rewards.yml and whatever the claim-mode is. Use it
  # for commands that are not a reward type. Placeholders: {player},
  # {service}, {streak}. Example:
  #   bonus-commands:
  #     30:
  #       - 'lp user {player} permission settemp my.perk true 7d'
  bonus-commands: {}

# ── Offline-vote reconciliation ─────────────────────────────────
# Votifier is real time: a vote cast while your server is offline never
# arrives. When this is on, a joining player is checked against each
# site's status API, and a vote they cast during the downtime is counted
# (reward, points, streak day) without doubling a vote that did arrive.
# Only sites with an 'api-url' in sites.yml are checked.
reconciliation:
  # Off by default: it needs an api-url and api-key per site.
  enabled: false
  # Minutes between two checks for the same player (protects the site APIs).
  player-cooldown-minutes: 30
  # HTTP timeout per site in seconds.
  timeout-seconds: 8

# ── Commands on Vote ────────────────────────────────────────────
# Console commands run on EVERY vote, on top of the rewards in
# rewards.yml. Prefer rewards.yml (items, XP, money, commands with a
# description the menus can show); use this list for commands that are
# not a reward. Placeholders: {player}, {service}, {streak}. Example:
#   commands-on-vote:
#     - 'discordsrv broadcast #votes {player} voted on {service}'
commands-on-vote: []

# ── Vote Records ────────────────────────────────────────────────
records:
  # Days to keep single vote records (used for cooldowns and
  # /jexvote debug-services). 0 = keep forever.
  retention-days: 90

# ── Network sync (Premium) ──────────────────────────────────────
# For several backends that share ONE database. Votes, points and
# streaks are already correct on a shared database; this only keeps
# the live vote party counter and its broadcasts in step on every
# backend. It uses the shared database, no Redis needed.
proxy:
  enabled: false
  # A unique id for THIS backend. Empty = a random id each start.
  server-id: ""
  # Seconds between two checks for new party events.
  event-poll-seconds: 2
  # Seconds between two full re-reads of the party counter.
  reconcile-seconds: 60
  # Minutes to keep party events before they are deleted.
  event-retention-minutes: 10

# ── Weekend bonus (Premium) ─────────────────────────────────────
# On the listed days every vote pays more: vote points and the top-level
# amount of xp and currency rewards are multiplied. Amounts inside
# composite, chance or lucky rewards are not multiplied.
multipliers:
  weekend:
    enabled: false
    # Multiplier on bonus days, for example 1.5 = 50 % more.
    factor: 1.2
    # Bonus days (English day names).
    days:
      - SATURDAY
      - SUNDAY
    # Time zone that decides which day it is.
    timezone: 'UTC'

# ── Vote Party (Premium) ────────────────────────────────────────
# A shared server counter. Every vote counts; when the target is
# reached, every player who voted for this party gets the party rewards
# (online now, offline on their next join) and the counter starts over.
# Rewards: vote-party-rewards and vote-party-pool in rewards.yml.
# Starting or stopping the party needs a server restart; a new target
# applies to the next party after /jexvote reload.
vote-party:
  enabled: true
  # Votes needed for one party.
  target: 100

# ── Bedrock (Geyser / Floodgate) ────────────────────────────────
# Bedrock players vote with their gamertag, but join with the Floodgate
# prefix in their name. Match these to your Floodgate config so their
# votes reach the right player. Bedrock players get forms instead of
# chest menus when Floodgate is installed.
bedrock:
  # The username-prefix from your Floodgate config.yml.
  # Set "" when you use no prefix.
  name-prefix: "!"
  # Also try the name with spaces replaced by '_' (Floodgate replace-spaces).
  replace-spaces: true

# ── Vote gifts ──────────────────────────────────────────────────
# A player who voted today can keep a friend's streak alive: the gift
# moves only the receiver's streak forward by one day. No items move and
# the gifter keeps their own vote and rewards.
#   /vote gift <player>  - gift a player
#   /vote gift random    - gift a random online player
vote-gift:
  enabled: true
  # Gifts per player per day. A player with 'jexvote.gift.daily.<n>'
  # can send up to <n> (the highest wins).
  daily-limit: 1
  # The gifter must have voted today before they can gift.
  require-vote-today: true
  # Time zone of the day boundary for the daily limit and "voted today".
  timezone: 'UTC'
  # Console commands run once per player per day, on their first vote of
  # the day. {player} is the voter's name. Empty = nothing runs. Example:
  #   commands:
  #     - 'give {player} diamond 1'
  daily-reward:
    commands: []

# ── Display ─────────────────────────────────────────────────────
display:
  # How currency rewards are written in menus:
  #   auto  - coin / crystal icons when JExEconomy is installed, names otherwise
  #   icons - always the icons (needs the JExcellence resource pack)
  #   names - always plain names, for example "500 Coins"
  currency-style: auto
  # Display names for currency ids used in rewards.yml. Ids that are not
  # listed use the translation reward_describe.unit.<id>, else the id.
  # Example:
  #   currency-names:
  #     money: 'Dollars'
  currency-names: {}

# ── Vote Effects ────────────────────────────────────────────────
# Sounds and titles for the voter. Turn all of them off with
# features.effects: false. Sound names: https://jd.papermc.io/paper/org/bukkit/Sound.html
vote-effects:
  # On every vote
  vote:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  # When the streak grows
  streak:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2
  # When a streak milestone is reached (fade-in, stay, fade-out in ticks, 20 = 1 s)
  milestone:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
    title: "<gradient:#5EEAD4:#A78BFA>Vote streak</gradient>"
    subtitle: "<#F1F5F9>New milestone reached</#F1F5F9>"
    fade-in: 10
    stay: 40
    fade-out: 10

# ── REST API ────────────────────────────────────────────────────
# Read-only HTTP endpoints for a website (vote sites, a player's
# cooldowns and stats). Every request must be signed with HMAC-SHA256
# using the secret below. Off by default.
#   GET /sites                    - the sites from sites.yml
#   GET /players/{uuid}/cooldown  - seconds until each site can be voted on
#   GET /players/{uuid}/stats     - votes, streak and points of a player
api:
  enabled: false
  # HTTP port; nothing else on the machine may use it.
  port: 8096
  # Shared secret. "$ENV:NAME" reads it from the environment variable
  # NAME, so the secret does not have to be in this file. The API does
  # not start while the secret is empty.
  secret: "$ENV:JEXVOTE_API_SECRET"
  # Value of the Access-Control-Allow-Origin header, for example
  # "https://example.com". "*" allows every site.
  cors-origin: "*"
  # Requests per minute per IP address.
  rate-limit-per-minute: 60
  # Reverse proxies whose X-Forwarded-For header is trusted for the
  # client IP. Leave empty when the API is not behind a proxy.
  trusted-proxies:
    - "127.0.0.1"
    - "::1"
