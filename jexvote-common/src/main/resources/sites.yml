# ╔═══════════════════════════════════════════════════════════════╗
# ║                    JExVote - Vote Sites                       ║
# ╚═══════════════════════════════════════════════════════════════╝
#
# One entry per vote listing site. Each site shows up as a card in /vote
# with its vote link and when the player can vote on it again.
#
#   <site-id>:                 Any short id, used as the key in site-rewards
#                              (rewards.yml).
#     display-name:            Name players see.
#     service-name:            The name the site sends with each vote. This is
#                              NOT the web address: many sites send a short
#                              name (for example "MCSL"). If votes arrive but
#                              no site matches, /jexvote debug-services lists
#                              the names that did arrive; copy one here.
#     vote-url:                Link players get when they click the site card.
#     points-per-vote:         Vote points per vote on this site (default 1).
#
#   When the player can vote again (pick one per site):
#     cooldown-minutes: 1440   Rolling window after their last vote (1440 = 24 h).
#     daily-reset: '00:00'     Fixed time of day, with timezone: 'UTC' (or any
#                              zone id such as 'Europe/Berlin').
#   Use what the site itself does; the card then shows the right time.
#
#   Offline votes (optional, needs reconciliation.enabled: true in config.yml):
#     api-url:                 The site's "has this player voted?" address with
#                              {username} and {key} placeholders (see the site's
#                              API docs).
#     api-key:                 Your server key for that API (fills {key}).
#     api-voted-contains:      Text in the answer that means "voted" (default "1").
#
# The Free edition loads the first 5 sites; Premium has no limit.
# Apply changes with /jexvote reload.
#

# These are the Mythblock sites; replace them with your own.
sites:
  minecraft-server:
    display-name: 'Minecraft-Serverliste'
    service-name: 'Minecraft-Serverliste.eu'
    vote-url: 'https://minecraft-server.eu/vote/index/239F1'
    cooldown-minutes: 1440
    points-per-vote: 1

  minecraft-servers:
    display-name: 'Minecraft-Servers'
    service-name: 'Minecraft-Servers.de'
    vote-url: 'https://minecraft-servers.de/server/mythblock/vote'
    cooldown-minutes: 1440
    points-per-vote: 1

  minecraft-server-list:
    display-name: 'Minecraft Server List'
    service-name: 'MCSL'
    vote-url: 'https://minecraft-server-list.com/server/520312/vote/'
    daily-reset: '00:00'
    timezone: 'UTC'
    points-per-vote: 1
    # Offline-vote reconciliation (optional), values from the site's API docs:
    # api-url: 'https://minecraft-server-list.com/server/520312/vote/json/?username={username}&key={key}'
    # api-key: 'YOUR_SERVER_KEY'
    # api-voted-contains: '1'

  minecraft-pocket-servers:
    display-name: 'MinecraftPocket Servers'
    service-name: 'MinecraftPocket-Servers.com'
    vote-url: 'https://minecraftpocket-servers.com/server/133747/'
    daily-reset: '00:00'
    timezone: 'UTC'
    points-per-vote: 1

  topg:
    display-name: 'TopG'
    service-name: 'TopG.org'
    vote-url: 'https://topg.org/minecraft-servers/server-684134'
    cooldown-minutes: 1440
    points-per-vote: 1

  minecraft-mp:
    display-name: 'Minecraft-MP'
    service-name: 'Minecraft-MP.com'
    vote-url: 'https://minecraft-mp.com/server/360836/vote/'
    cooldown-minutes: 1440
    points-per-vote: 1

  minecraft-serverlist:
    display-name: 'Minecraft Serverlist'
    service-name: 'Minecraft-Serverlist.com'
    vote-url: 'https://minecraft-serverlist.com/server/5753/vote'
    cooldown-minutes: 1440
    points-per-vote: 1

  serverliste:
    display-name: 'Serverliste'
    service-name: 'Serverliste.net'
    vote-url: 'https://serverliste.net/vote/5621'
    cooldown-minutes: 1440
    points-per-vote: 1

  findmcserver:
    display-name: 'FindMCServer'
    service-name: 'FindMCServer.com'
    vote-url: 'https://findmcserver.com/server/ttQ1PVlRNY'
    cooldown-minutes: 1440
    points-per-vote: 1

  mcstat:
    display-name: 'MCStat'
    service-name: 'MCStat'
    vote-url: 'https://mcstat.org/de/servers/mythblockme'
    cooldown-minutes: 1440
    points-per-vote: 1
