# JExVote - English translations
#
# Colour language (shared with the rest of the suite):
#   names #F1F5F9 | section titles #C4B5FD | muted text #94A3B8 | accent #A78BFA
#   ok #4ADE80 | bad #F87171 | warning #FBBF24 | titles <gradient:#5EEAD4:#A78BFA>
# Status tokens: [OK] done, [+] ready, [!] blocked or short, [X] locked or failed.
# Optional per-card hook: add a list under <card key>.lore_extra (for example
# vote_overview.header.lore_extra) and its lines are shown as an extra block.

prefix: '<gradient:#5EEAD4:#A78BFA>Vote</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menu</#F1F5F9>'
  back: '<#F1F5F9>Back</#F1F5F9>'

# ── Chat messages ────────────────────────────────────────────────────────────
vote:
  broadcast: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>{player} voted on {service}.</#F1F5F9> <#94A3B8>Vote too with /vote</#94A3B8>'
  received: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Thanks for voting on {service}. Your streak is now</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  guaranteed_reward: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>You also got a</#F1F5F9> <#A78BFA>Vote Crate key</#A78BFA> <#F1F5F9>for this vote.</#F1F5F9>'
  offline-summary: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Your</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>votes while you were offline paid out:</#F1F5F9><newline>{rewards}'
  offline-summary-empty: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Welcome back. Your</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>offline votes were counted.</#F1F5F9>'
  offline-summary-entry: '<#A78BFA>+</#A78BFA> {reward}'
  offline-summary-entry-stacked: '<#A78BFA>+</#A78BFA> {reward} <#94A3B8>x{count}</#94A3B8>'
  site-link: "<#A78BFA>▸</#A78BFA> <#F1F5F9>Vote on {site}:</#F1F5F9> <click:open_url:'{url}'><hover:show_text:'<#94A3B8>Opens the vote page in your browser</#94A3B8>'><#A78BFA><u>{url}</u></#A78BFA></hover></click>"
  unknown-player: 'Unknown'
  shop:
    players_only: '<#F87171>[X]</#F87171> <#F1F5F9>Only players can open the vote shop.</#F1F5F9>'
    unavailable: '<#F87171>[X]</#F87171> <#F1F5F9>The vote shop is not available on this server.</#F1F5F9>'
  lucky:
    hit: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Lucky vote! You won a bonus reward.</#F1F5F9> <#94A3B8>{chance}</#94A3B8>'
    jackpot: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Lucky vote! You won</#F1F5F9> {reward}<#F1F5F9>.</#F1F5F9>'
  freeze:
    granted: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>You got</#F1F5F9> <#A78BFA>{amount}</#A78BFA> <#F1F5F9>free Streak Freeze. It saves your streak once if you miss a day. Buy more with</#F1F5F9> <#A78BFA>/vote freeze</#A78BFA><#F1F5F9>.</#F1F5F9>'
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>A Streak Freeze saved your streak of</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>. Used</#F1F5F9> <#A78BFA>{consumed}</#A78BFA><#F1F5F9>,</#F1F5F9> <#A78BFA>{remaining}</#A78BFA> <#F1F5F9>left.</#F1F5F9>'
    bought: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Streak Freeze bought for</#F1F5F9> <#A78BFA>{cost} points</#A78BFA><#F1F5F9>.</#F1F5F9>'
    disabled: '<#F87171>[X]</#F87171> <#F1F5F9>Streak Freezes are turned off on this server.</#F1F5F9>'
    at_max: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>You already own the most you can hold:</#F1F5F9> <#A78BFA>{max}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    not_enough: '<#F87171>[X]</#F87171> <#F1F5F9>A Streak Freeze costs</#F1F5F9> <#A78BFA>{cost} points</#A78BFA><#F1F5F9>. Vote to earn more.</#F1F5F9>'
    no_profile: '<#F87171>[X]</#F87171> <#F1F5F9>Vote once before you buy a Streak Freeze.</#F1F5F9>'
    error: '<#F87171>[X]</#F87171> <#F1F5F9>The purchase did not go through. Try again.</#F1F5F9>'
  daily-fly: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>You got</#F1F5F9> <#A78BFA>15 min</#A78BFA> <#F1F5F9>of flight for voting today.</#F1F5F9>'
  gift:
    usage: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Use</#F1F5F9> <#A78BFA>/vote gift <player|random></#A78BFA>'
    sent: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>You kept</#F1F5F9> <#A78BFA>{target}</#A78BFA><#F1F5F9>''s streak alive. It is now</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>. Gifts left today:</#F1F5F9> <#A78BFA>{remaining}</#A78BFA>'
    received: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{gifter}</#A78BFA> <#F1F5F9>kept your vote streak alive. It is now</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    disabled: '<#F87171>[X]</#F87171> <#F1F5F9>Vote gifts are turned off on this server.</#F1F5F9>'
    gifter_no_profile: '<#F87171>[X]</#F87171> <#F1F5F9>Vote once before you send a gift.</#F1F5F9>'
    not_voted: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Vote today first, then you can send a gift.</#F1F5F9>'
    limit: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>You used all your gifts for today.</#F1F5F9>'
    self: '<#F87171>[X]</#F87171> <#F1F5F9>You can''t send a gift to yourself.</#F1F5F9>'
    target_not_found: '<#F87171>[X]</#F87171> <#A78BFA>{target}</#A78BFA> <#F1F5F9>has never voted, so there is no streak to keep alive.</#F1F5F9>'
    already_advanced: '<#FBBF24>[!]</#FBBF24> <#A78BFA>{target}</#A78BFA> <#F1F5F9>already moved their streak forward today.</#F1F5F9>'
    no_random: '<#F87171>[X]</#F87171> <#F1F5F9>No other player is online to get a gift.</#F1F5F9>'
    error: '<#F87171>[X]</#F87171> <#F1F5F9>The gift did not go through. Try again.</#F1F5F9>'
  party:
    progress: '<#94A3B8>Vote party</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{current} / {target}</#F1F5F9>'
    reached: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Vote party #{party} is complete. Everyone who voted gets party rewards.</#F1F5F9>'
  no_permission: '<#F87171>[X]</#F87171> <#F1F5F9>You don''t have permission to do that.</#F1F5F9>'
  player_not_found: '<#F87171>[X]</#F87171> <#F1F5F9>No player named</#F1F5F9> <#A78BFA>{player}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  stats:
    title: '<gradient:#5EEAD4:#A78BFA>Vote stats</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{player}</#F1F5F9>'
    row: '<#94A3B8>{label}</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{value}</#F1F5F9>'
    label:
      total: 'All-time votes'
      monthly: 'This month'
      streak: 'Streak'
      highest: 'Best streak'
      points: 'Vote points'
      last-vote: 'Last vote'
  leaderboard:
    title: '<gradient:#5EEAD4:#A78BFA>Top voters</gradient> <dark_gray>|</dark_gray> <#F1F5F9>All time</#F1F5F9>'
    entry: '<#A78BFA>#{rank}</#A78BFA> <#F1F5F9>{player}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{votes} votes</#94A3B8>'
    empty: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>No votes yet.</#F1F5F9>'
  reload: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>config.yml, rewards.yml and sites.yml reloaded.</#F1F5F9>'
  reset:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Vote stats of</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>were reset.</#F1F5F9>'
    all_success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Monthly votes were reset for every player.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#F1F5F9>No vote data found for</#F1F5F9> <#A78BFA>{player}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  setstreak:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Streak of</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>set to</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#F1F5F9>No vote data found for</#F1F5F9> <#A78BFA>{player}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    invalid: '<#F87171>[X]</#F87171> <#F1F5F9>The streak must be 0 or higher.</#F1F5F9>'
  fakevote:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Test vote sent for</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>on</#F1F5F9> <#A78BFA>{service}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>The test vote was not processed. Check the console.</#F1F5F9>'
  sites:
    title: '<gradient:#5EEAD4:#A78BFA>Vote sites</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{count}</#F1F5F9>'
    entry: "<#A78BFA>▸</#A78BFA> <#F1F5F9>{name}</#F1F5F9> <dark_gray>|</dark_gray> <click:open_url:'{url}'><hover:show_text:'<#94A3B8>Opens the vote page in your browser</#94A3B8><newline><#F1F5F9>{url}</#F1F5F9>'><#A78BFA><u>Click to vote</u></#A78BFA></hover></click>"
    entry_plain: '<#A78BFA>▸</#A78BFA> <#F1F5F9>{name}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{service}</#94A3B8>'
    no_sites: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>No vote sites are set up yet.</#F1F5F9>'

