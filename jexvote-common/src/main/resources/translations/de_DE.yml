# JExVote - Deutsche Übersetzungen
#
# Farbsprache (wie im Rest der Suite):
#   Namen #F1F5F9 | Abschnittstitel #C4B5FD | gedämpfter Text #94A3B8 | Akzent #A78BFA
#   OK #4ADE80 | Fehler #F87171 | Warnung #FBBF24 | Titel <gradient:#5EEAD4:#A78BFA>
# Status-Marker im Chat: [OK] erledigt, [!] blockiert oder zu wenig, [X] fehlgeschlagen oder aus.
# Menü-Lore nutzt keine Status-Marker: ein gefüllter Punkt zeigt einen aktiven
# Zustand, ein leerer einen offenen, und jede Karte hat höchstens eine
# Aktionszeile mit Pfeil.
# Optional pro Karte: eine Liste unter <Kartenschlüssel>.lore_extra (z. B.
# vote_overview.header.lore_extra) wird als zusätzlicher Block angezeigt.

prefix: '<gradient:#5EEAD4:#A78BFA>Vote</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menü</#F1F5F9>'
  back: '<#F1F5F9>Zurück</#F1F5F9>'

# ── Chat-Nachrichten ─────────────────────────────────────────────────────────
vote:
  broadcast: '<#A78BFA>▸</#A78BFA> <#F1F5F9>{player} hat auf {service} gevotet.</#F1F5F9> <#94A3B8>Vote auch mit /vote</#94A3B8>'
  received: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Danke fürs Voten auf {service}. Deine Vote-Serie steht jetzt bei</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  guaranteed-rewards: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Jeder Vote bringt außerdem:</#F1F5F9> {rewards}'
  list-separator: '<#94A3B8>, </#94A3B8>'
  offline-summary: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deine</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>Votes, während du offline warst, wurden ausgezahlt:</#F1F5F9><newline>{rewards}'
  offline-summary-empty: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Willkommen zurück. Deine</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>Offline-Votes wurden gezählt.</#F1F5F9>'
  offline-summary-entry: '<#A78BFA>+</#A78BFA> {reward}'
  offline-summary-entry-stacked: '<#A78BFA>+</#A78BFA> {reward} <#94A3B8>x{count}</#94A3B8>'
  site-link: "<#A78BFA>▸</#A78BFA> <#F1F5F9>Vote auf {site}:</#F1F5F9> <click:open_url:'{url}'><hover:show_text:'<#94A3B8>Öffnet die Vote-Seite im Browser</#94A3B8>'><#A78BFA><u>{url}</u></#A78BFA></hover></click>"
  unknown-player: 'Unbekannt'
  shop:
    players_only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur Spieler können den Vote-Shop öffnen.</#F1F5F9>'
    unavailable: '<#F87171>[X]</#F87171> <#F1F5F9>Der Vote-Shop ist auf diesem Server nicht verfügbar.</#F1F5F9>'
  lucky:
    hit: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glücks-Vote! Du hast eine Bonus-Belohnung gewonnen.</#F1F5F9> <#94A3B8>{chance}</#94A3B8>'
    jackpot: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Glücks-Vote! Du hast</#F1F5F9> {reward} <#F1F5F9>gewonnen.</#F1F5F9>'
  freeze:
    granted: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Du hast</#F1F5F9> <#A78BFA>{amount}</#A78BFA> <#F1F5F9>kostenlosen Streak-Freeze bekommen. Er rettet deine Serie einmal, wenn du einen Tag verpasst. Weitere kaufst du mit</#F1F5F9> <#A78BFA>/vote freeze</#A78BFA><#F1F5F9>.</#F1F5F9>'
