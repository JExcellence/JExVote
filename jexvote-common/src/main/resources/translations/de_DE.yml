    invalid-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine ganze Zahl.</#F1F5F9>'
    invalid-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine Zahl.</#F1F5F9>'
    not-positive-long: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    not-positive-double: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>muss größer als 0 sein.</#F1F5F9>'
    invalid-uuid: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keine gültige UUID.</#F1F5F9>'
    invalid-enum: '<#F87171>[X]</#F87171> <#A78BFA>{value}</#A78BFA> <#F1F5F9>ist keins von</#F1F5F9> <#94A3B8>{options}</#94A3B8><#F1F5F9>.</#F1F5F9>'
