# JExVote - Deutsche Übersetzungen
#
# Farbsprache (wie im Rest der Suite):
#   Namen #F1F5F9 | Abschnittstitel #C4B5FD | gedämpfter Text #94A3B8 | Akzent #A78BFA
#   OK #4ADE80 | Fehler #F87171 | Warnung #FBBF24 | Titel <gradient:#5EEAD4:#A78BFA>
# Status-Marker: [OK] erledigt, [+] bereit, [!] blockiert oder zu wenig, [X] gesperrt oder fehlgeschlagen.
# Optional pro Karte: eine Liste unter <Kartenschlüssel>.lore_extra (z. B.
# vote_overview.header.lore_extra) wird als zusätzlicher Block angezeigt.

prefix: '<gradient:#5EEAD4:#A78BFA>Vote</gradient> <dark_gray>»</dark_gray> '

_defaults:
  title: '<#F1F5F9>Menü</#F1F5F9>'
  back: '<#F1F5F9>Zurück</#F1F5F9>'

# ── Chat-Nachrichten ─────────────────────────────────────────────────────────
vote:
  broadcast: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>{player} hat auf {service} gevotet.</#F1F5F9> <#94A3B8>Vote auch mit /vote</#94A3B8>'
  received: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Danke fürs Voten auf {service}. Deine Vote-Serie steht jetzt bei</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  guaranteed_reward: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Für diesen Vote hast du außerdem einen</#F1F5F9> <#A78BFA>Vote-Crate-Key</#A78BFA> <#F1F5F9>bekommen.</#F1F5F9>'
  offline-summary: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Deine</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>Votes, während du offline warst, wurden ausgezahlt:</#F1F5F9><newline>{rewards}'
  offline-summary-empty: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Willkommen zurück. Deine</#F1F5F9> <#A78BFA>{count}</#A78BFA> <#F1F5F9>Offline-Votes wurden gezählt.</#F1F5F9>'
  offline-summary-entry: '<#A78BFA>+</#A78BFA> {reward}'
  offline-summary-entry-stacked: '<#A78BFA>+</#A78BFA> {reward} <#94A3B8>x{count}</#94A3B8>'
  site-link: "<#A78BFA>▸</#A78BFA> <#F1F5F9>Vote auf {site}:</#F1F5F9> <click:open_url:'{url}'><hover:show_text:'<#94A3B8>Öffnet die Vote-Seite im Browser</#94A3B8>'><#A78BFA><u>{url}</u></#A78BFA></hover></click>"
  unknown-player: 'Unbekannt'
  shop:
    players_only: '<#F87171>[X]</#F87171> <#F1F5F9>Nur Spieler können den Vote-Shop öffnen.</#F1F5F9>'
    unavailable: '<#F87171>[X]</#F87171> <#F1F5F9>Der Vote-Shop ist auf diesem Server nicht verfügbar.</#F1F5F9>'
  lucky:
    hit: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Glücks-Vote! Du hast eine Bonus-Belohnung gewonnen.</#F1F5F9> <#94A3B8>{chance}</#94A3B8>'
    jackpot: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Glücks-Vote! Du hast</#F1F5F9> {reward} <#F1F5F9>gewonnen.</#F1F5F9>'
  freeze:
    granted: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Du hast</#F1F5F9> <#A78BFA>{amount}</#A78BFA> <#F1F5F9>kostenlosen Streak-Freeze bekommen. Er rettet deine Serie einmal, wenn du einen Tag verpasst. Weitere kaufst du mit</#F1F5F9> <#A78BFA>/vote freeze</#A78BFA><#F1F5F9>.</#F1F5F9>'
    saved: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Ein Streak-Freeze hat deine Serie von</#F1F5F9> <#A78BFA>{streak}</#A78BFA> <#F1F5F9>gerettet. Verbraucht:</#F1F5F9> <#A78BFA>{consumed}</#A78BFA><#F1F5F9>, übrig:</#F1F5F9> <#A78BFA>{remaining}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    bought: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Streak-Freeze für</#F1F5F9> <#A78BFA>{cost} Punkte</#A78BFA> <#F1F5F9>gekauft.</#F1F5F9>'
    disabled: '<#F87171>[X]</#F87171> <#F1F5F9>Streak-Freezes sind auf diesem Server ausgeschaltet.</#F1F5F9>'
    at_max: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du besitzt schon die Höchstzahl:</#F1F5F9> <#A78BFA>{max}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    not_enough: '<#F87171>[X]</#F87171> <#F1F5F9>Ein Streak-Freeze kostet</#F1F5F9> <#A78BFA>{cost} Punkte</#A78BFA><#F1F5F9>. Vote, um mehr zu verdienen.</#F1F5F9>'
    no_profile: '<#F87171>[X]</#F87171> <#F1F5F9>Vote einmal, bevor du einen Streak-Freeze kaufst.</#F1F5F9>'
    error: '<#F87171>[X]</#F87171> <#F1F5F9>Der Kauf hat nicht geklappt. Versuche es erneut.</#F1F5F9>'
  daily-fly: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Du hast</#F1F5F9> <#A78BFA>15 Min.</#A78BFA> <#F1F5F9>Flugzeit fürs heutige Voten bekommen.</#F1F5F9>'
  gift:
    usage: '<#A78BFA>▸</#A78BFA> <#F1F5F9>Nutze</#F1F5F9> <#A78BFA>/vote gift <Spieler|random></#A78BFA>'
    sent: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Du hast die Serie von</#F1F5F9> <#A78BFA>{target}</#A78BFA> <#F1F5F9>am Leben gehalten. Sie steht jetzt bei</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>. Geschenke heute übrig:</#F1F5F9> <#A78BFA>{remaining}</#A78BFA>'
    received: '<#4ADE80>[OK]</#4ADE80> <#A78BFA>{gifter}</#A78BFA> <#F1F5F9>hat deine Vote-Serie am Leben gehalten. Sie steht jetzt bei</#F1F5F9> <#A78BFA>{streak}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    disabled: '<#F87171>[X]</#F87171> <#F1F5F9>Vote-Geschenke sind auf diesem Server ausgeschaltet.</#F1F5F9>'
    gifter_no_profile: '<#F87171>[X]</#F87171> <#F1F5F9>Vote einmal, bevor du etwas verschenkst.</#F1F5F9>'
    not_voted: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Vote zuerst heute, dann kannst du verschenken.</#F1F5F9>'
    limit: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du hast heute alle Geschenke verbraucht.</#F1F5F9>'
    self: '<#F87171>[X]</#F87171> <#F1F5F9>Du kannst dir nicht selbst etwas schenken.</#F1F5F9>'
    target_not_found: '<#F87171>[X]</#F87171> <#A78BFA>{target}</#A78BFA> <#F1F5F9>hat noch nie gevotet, es gibt keine Serie zu retten.</#F1F5F9>'
    already_advanced: '<#FBBF24>[!]</#FBBF24> <#A78BFA>{target}</#A78BFA> <#F1F5F9>hat die Serie heute schon weitergebracht.</#F1F5F9>'
    no_random: '<#F87171>[X]</#F87171> <#F1F5F9>Kein anderer Spieler ist online, der ein Geschenk bekommen kann.</#F1F5F9>'
    error: '<#F87171>[X]</#F87171> <#F1F5F9>Das Geschenk hat nicht geklappt. Versuche es erneut.</#F1F5F9>'
  party:
    progress: '<#94A3B8>Vote-Party</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{current} / {target}</#F1F5F9>'
    reached: '<#A78BFA>[+]</#A78BFA> <#F1F5F9>Vote-Party #{party} ist geschafft. Alle, die gevotet haben, bekommen Party-Belohnungen.</#F1F5F9>'
  no_permission: '<#F87171>[X]</#F87171> <#F1F5F9>Dafür hast du keine Berechtigung.</#F1F5F9>'
  player_not_found: '<#F87171>[X]</#F87171> <#F1F5F9>Kein Spieler namens</#F1F5F9> <#A78BFA>{player}</#A78BFA><#F1F5F9>.</#F1F5F9>'
  stats:
    title: '<gradient:#5EEAD4:#A78BFA>Vote-Statistik</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{player}</#F1F5F9>'
    row: '<#94A3B8>{label}</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>{value}</#F1F5F9>'
    label:
      total: 'Votes gesamt'
      monthly: 'Diesen Monat'
      streak: 'Vote-Serie'
      highest: 'Beste Serie'
      points: 'Vote-Punkte'
      last-vote: 'Letzter Vote'
  leaderboard:
    title: '<gradient:#5EEAD4:#A78BFA>Top-Voter</gradient> <dark_gray>|</dark_gray> <#F1F5F9>Gesamt</#F1F5F9>'
    entry: '<#A78BFA>#{rank}</#A78BFA> <#F1F5F9>{player}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{votes} Votes</#94A3B8>'
    empty: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Noch keine Votes.</#F1F5F9>'
  reload: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>config.yml, rewards.yml und sites.yml neu geladen.</#F1F5F9>'
  reset:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Die Vote-Statistik von</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>wurde zurückgesetzt.</#F1F5F9>'
    all_success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Die Monats-Votes aller Spieler wurden zurückgesetzt.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#F1F5F9>Keine Vote-Daten für</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>gefunden.</#F1F5F9>'
  setstreak:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Die Serie von</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>steht jetzt bei</#F1F5F9> <#A78BFA>{value}</#A78BFA><#F1F5F9>.</#F1F5F9>'
    not_found: '<#F87171>[X]</#F87171> <#F1F5F9>Keine Vote-Daten für</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>gefunden.</#F1F5F9>'
    invalid: '<#F87171>[X]</#F87171> <#F1F5F9>Die Serie muss 0 oder größer sein.</#F1F5F9>'
  fakevote:
    success: '<#4ADE80>[OK]</#4ADE80> <#F1F5F9>Test-Vote für</#F1F5F9> <#A78BFA>{player}</#A78BFA> <#F1F5F9>auf</#F1F5F9> <#A78BFA>{service}</#A78BFA> <#F1F5F9>gesendet.</#F1F5F9>'
    failed: '<#F87171>[X]</#F87171> <#F1F5F9>Der Test-Vote wurde nicht verarbeitet. Sieh in die Konsole.</#F1F5F9>'
  sites:
    title: '<gradient:#5EEAD4:#A78BFA>Vote-Seiten</gradient> <dark_gray>|</dark_gray> <#F1F5F9>{count}</#F1F5F9>'
    entry: "<#A78BFA>▸</#A78BFA> <#F1F5F9>{name}</#F1F5F9> <dark_gray>|</dark_gray> <click:open_url:'{url}'><hover:show_text:'<#94A3B8>Öffnet die Vote-Seite im Browser</#94A3B8><newline><#F1F5F9>{url}</#F1F5F9>'><#A78BFA><u>Klicke zum Voten</u></#A78BFA></hover></click>"
    entry_plain: '<#A78BFA>▸</#A78BFA> <#F1F5F9>{name}</#F1F5F9> <dark_gray>|</dark_gray> <#94A3B8>{service}</#94A3B8>'
    no_sites: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Es sind noch keine Vote-Seiten eingerichtet.</#F1F5F9>'

