    gifter_no_profile: '<#F87171>[X]</#F87171> <#F1F5F9>Vote einmal, bevor du etwas verschenkst.</#F1F5F9>'
    not_voted: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Vote zuerst heute, dann kannst du verschenken.</#F1F5F9>'
    limit: '<#FBBF24>[!]</#FBBF24> <#F1F5F9>Du hast heute alle Geschenke verbraucht.</#F1F5F9>'
    self: '<#F87171>[X]</#F87171> <#F1F5F9>Du kannst dir nicht selbst etwas schenken.</#F1F5F9>'
    target_not_found: '<#F87171>[X]</#F87171> <#A78BFA>{target}</#A78BFA> <#F1F5F9>hat noch nie gevotet, es gibt keine Serie zu retten.</#F1F5F9>'
    already_advanced: '<#FBBF24>[!]</#FBBF24> <#A78BFA>{target}</#A78BFA> <#F1F5F9>hat die Serie heute schon weitergebracht.</#F1F5F9>'
