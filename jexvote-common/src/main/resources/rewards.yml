vote-party:
  animation:
    # Frames of the prize spin before the reveal.
    spin-frames: 14
    # Ticks between two frames (20 ticks = 1 second).
    frame-ticks: 3
    # Prize draws every player gets.
    guaranteed-picks: 3
    # Most draws in total (guaranteed + extra).
    max-total-picks: 10
    # Chance of the first extra draw; each further one is extra-step lower.
    extra-start-chance: 0.75
    extra-step: 0.08
  sounds:
    spin: BLOCK_NOTE_BLOCK_HAT
    spin-volume: 0.7
    spin-pitch-base: 1.0
    spin-pitch-step: 0.1
    reveal: UI_TOAST_CHALLENGE_COMPLETE
    reveal-volume: 1.0
    reveal-pitch: 1.0
  # The spin / reveal texts come from the translation files
  # (vote_party.titles.*). To use the same text for everyone, set
  # spin, reveal and reveal-subtitle here as MiniMessage.
  titles:
    # Title timing in milliseconds.
    fade-in: 0
    stay: 200
    fade-out: 0

# ── Vote shop (Premium) ─────────────────────────────────────────
# /vote shop: players spend vote points here (about 1 per vote). Fields:
#   name         name in the menu and in chat
#   icon         item shown in the menu
#   cost         price in vote points
#   description  lore lines under the name (MiniMessage); the menu adds
#                "You get" and the price on its own
#   reward       what the player gets (any reward type)
#   purchase-sound / purchase-volume / purchase-pitch / purchase-messages  (optional)
vote-shop:
  iron-bundle:
    name: Iron Bundle
    icon: IRON_INGOT
    cost: 10
    description:
    - <gray>A stack of refined iron for hoppers,
    - <gray>rails, anvils and every build.
    reward:
      type: item
      material: IRON_INGOT
      amount: 32
  gold-bundle:
    name: Gold Bundle
    icon: GOLD_INGOT
    cost: 12
    description:
    - <gray>Gold for powered rails, clocks
    - <gray>and redstone builds.
    reward:
      type: item
      material: GOLD_INGOT
      amount: 32
  diamond-bundle:
    name: Diamond Bundle
    icon: DIAMOND
    cost: 18
    description:
    - <gray>Eight diamonds for a set of tools
    - <gray>or a head start on enchanting.
    reward:
      type: item
      material: DIAMOND
      amount: 8
  xp-bundle:
    name: Experience Bundle
    icon: EXPERIENCE_BOTTLE
    cost: 12
    description:
    - <gray>Instant levels for enchanting.
    reward:
      type: item
      material: EXPERIENCE_BOTTLE
      amount: 32
    purchase-pitch: 1.2
  hopper-bundle:
    name: Hopper Bundle
    icon: HOPPER
    cost: 10
    description:
    - <gray>Pipe your one block's drops
    - <gray>straight into storage.
    reward:
      type: item
      material: HOPPER
      amount: 16
  obsidian-bundle:
    name: Obsidian Bundle
    icon: OBSIDIAN
    cost: 12
    description:
    - <gray>Portals, blast protection and
    - <gray>foundations that never break.
    reward:
      type: item
      material: OBSIDIAN
      amount: 16
  coin-pouch:
    name: Coin Pouch
    icon: GOLD_NUGGET
    cost: 15
    description:
    - <gray>Spending money, straight into
    - <gray>your island bank.
    reward:
      type: currency
      currency: coins
      amount: 20000.0
  fly-voucher:
    name: Flight Vouchers
    icon: FEATHER
    cost: 18
