# ── Vote party (Premium) ────────────────────────────────────────
# Paid to EVERY player who voted towards a vote party when it completes
# (online players at once, offline players on their next join). Target and
# on/off switch are under 'vote-party' in config.yml. The Free edition keeps
# the vote party off.
#   vote-party-rewards : a small guaranteed payout for everyone
#   vote-party-pool    : weighted prizes; each player gets 3 draws plus
#                        extra draws with falling chance (75%, then 8% less
#                        per step, at most 10 in total)
vote-party-rewards:
  party-xp:
    type: xp
    amount: 200
  party-coins:
    type: currency
