# ╔═══════════════════════════════════════════════════════════════╗
# ║                  JExVote - Rewards                            ║
# ╚═══════════════════════════════════════════════════════════════╝
#
# Everything a vote pays. These defaults are the Mythblock setup: they use
# JExEconomy currencies (coins, crystals), JExCrates keys, JExOneblock
# commands and LuckPerms. A setup with vanilla items and XP only is in
# docs/generic/rewards.yml of the JExVote source. JExVote never adds
# entries back into this file, so a reward you delete stays deleted.
# Apply changes with /jexvote reload.
#
# Each reward has an id (any unique name) and a 'type'. The types are listed
# at the end of this file. Crate keys, island radius and flight coupons are
# described in the menus on their own; other 'command' rewards carry a
# 'describe' (plain text, MiniMessage or a translation key).

# ── Every vote ──────────────────────────────────────────────────
# Paid on every vote on any site: a little XP and coins.
default-rewards:
  vote-xp:
    type: xp
    amount: 35
  vote-coins:
    type: currency
    currency: coins
    amount: 500.0
  # Lucky vote: every vote also draws exactly ONE prize from this pool. The
  # weights add up to about 100, so each weight is roughly the chance in percent. About 78%
  # are small thank-you prizes, 17% a nice hit, 4% real value and under 0.6%
  # the rare keys and Crystals. The 'id' counts how often a prize was won
  # (/vote rewards and %jexvote_reward_count_<id>%).
  vote-jackpot:
    type: lucky
    entries:
    - weight: 30
      id: jackpot-coins-small
      reward:
        type: currency
        currency: coins
        amount: 600.0
    - weight: 20
      id: jackpot-xp
      reward:
        type: xp
        amount: 100
    - weight: 15
      id: jackpot-diamonds
      reward:
        type: item
        material: DIAMOND
        amount: 2
    - weight: 13
      id: jackpot-coins-medium
      reward:
        type: currency
        currency: coins
        amount: 2500.0
    - weight: 8
      id: jackpot-coins-large
      reward:
        type: currency
        currency: coins
        amount: 5000.0
    - weight: 5
      id: jackpot-vote-crate
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: crate give key {player} VoteCrate 1
        asConsole: true
    - weight: 4
      id: jackpot-region
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: jexoneblock player grant-radius {player} 2
        asConsole: true
    - weight: 2
      id: jackpot-coins-huge
      announce: vote.lucky.jackpot
      reward:
        type: currency
        currency: coins
        amount: 10000.0
    - weight: 1.5
      id: jackpot-netherite-scrap
      reward:
        type: item
        material: NETHERITE_SCRAP
        amount: 1
    - weight: 0.9
      id: jackpot-shadow-crate
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: crate give key {player} ShadowCrate 1
        asConsole: true
    - weight: 0.4
      id: jackpot-void-crate
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: crate give key {player} VoidCrate 1
        asConsole: true
    - weight: 0.14
      id: jackpot-crystals
      announce: vote.lucky.jackpot
      reward:
        type: currency
        currency: crystals
        amount: 25.0
    - weight: 0.1
      id: jackpot-crystals-mega
      announce: vote.lucky.jackpot
      reward:
        type: currency
        currency: crystals
        amount: 100.0
    - weight: 0.05
      id: jackpot-dragon-crate
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: crate give key {player} DragonCrate 1
        asConsole: true
    - weight: 0.01
      id: jackpot-season-crate
      announce: vote.lucky.jackpot
      reward:
        type: command
        command: crate give key {player} SeasonCrate 1
        asConsole: true

# ── Guaranteed extras ───────────────────────────────────────────
# Paid on every vote on top of default-rewards, and named in the
# "Every vote also pays" chat line. A list, not a map. Offline voters get
# it on their next join, once per vote.
guaranteed-rewards:
- type: command
  command: crate give key {player} VoteCrate 1
  asConsole: true

# ── Streak milestones ───────────────────────────────────────────
# Extra rewards when a streak reaches the given day, on top of the vote
# rewards. /vote streak lists every milestone.
#
#   Day  Headline
#     1  Voter's Iron
#     3  Vote key, 45 min flight, iron
#     7  2 Vote keys, Voter's Pickaxe, 2 diamonds
#    14  Void key, 2 Vote keys, +10 island radius
#    21  Void key, 5 Vote keys, 8 diamonds, 30 min flight
#    30  Devoted Voter's Crown (unique), +15 radius, Season key
#    60  +10 radius, 10 Vote keys, Sigil pass 30 days
#    90  +10 radius, 3 Void keys, 5 Vote keys, 16 diamonds
#   120  +10 radius, 5 Void keys, Aether pass 7 days
#   180  +10 radius, 2 Shadow keys, 2 Void keys, Eclipse pass 7 days
#   365  10 Dragon keys, Mythic rank 30 days, +50 radius
#
# Passes and ranks use LuckPerms 'addtemp ... accumulate', so they stack onto
# an already running pass or rank.
streak-rewards:
  '1':
    streak-1-xp:
      type: xp
      amount: 50
    streak-1-coins:
      type: currency
      currency: coins
      amount: 1500.0
    streak-1-iron:
      type: item
      material: IRON_INGOT
      amount: 8
      name: <gradient:#ffffff:#bdc3c7>Voter's Iron</gradient>
      lore:
      - <gray>A warm-up reward for showing up.
  '3':
    streak-3-xp:
      type: xp
      amount: 80
    streak-3-coins:
      type: currency
      currency: coins
      amount: 2000.0
    streak-3-crate:
      type: command
      command: crate give key {player} VoteCrate 1
      asConsole: true
    # Flight as three 15-minute coupon items, so nothing is lost to the fly
    # time cap. The player must be online when the streak fires.
    streak-3-flytime:
      type: command
      command: jexoneblock economy flycoupon {player} 15 3
      asConsole: true
    streak-3-iron:
      type: item
      material: IRON_INGOT
      amount: 16
      name: <gradient:#ffffff:#bdc3c7>Voter's Ingots</gradient>
      lore:
      - <gray>Three days in - keep it going.
  '7':
    streak-7-xp:
      type: xp
      amount: 150
    streak-7-coins:
      type: currency
      currency: coins
      amount: 4000.0
    streak-7-crate:
      type: command
      command: crate give key {player} VoteCrate 2
      asConsole: true
    streak-7-pickaxe:
      type: item
      material: IRON_PICKAXE
      amount: 1
      name: <gradient:#ffffff:#bdc3c7>Voter's Pickaxe</gradient>
      lore:
      - <gray>Forged from a week of devotion.
      enchantments:
        efficiency: 1
        unbreaking: 3
      glow: true
    streak-7-diamonds:
      type: item
      material: DIAMOND
      amount: 2
  '14':
    streak-14-xp:
      type: xp
      amount: 250
    streak-14-coins:
      type: currency
      currency: coins
      amount: 8000.0
    streak-14-void-key:
      type: command
      command: crate give key {player} VoidCrate 1
      asConsole: true
    streak-14-vote-key:
      type: command
      command: crate give key {player} VoteCrate 2
      asConsole: true
    streak-14-radius:
      type: command
      command: jexoneblock player grant-radius {player} 10
      asConsole: true
  '21':
    streak-21-xp:
      type: xp
      amount: 400
    streak-21-coins:
      type: currency
      currency: coins
      amount: 12000.0
    streak-21-void-key:
      type: command
      command: crate give key {player} VoidCrate 1
      asConsole: true
    streak-21-vote-key:
      type: command
      command: crate give key {player} VoteCrate 5
      asConsole: true
    streak-21-fly:
      type: command
      command: jexoneblock economy flycoupon {player} 15 2
      asConsole: true
    streak-21-diamonds:
      type: item
      material: DIAMOND
      amount: 8
  # The signature milestone: a crown you can only get from a 30-day streak.
  '30':
    streak-30-xp:
      type: xp
      amount: 800
    streak-30-coins:
      type: currency
      currency: coins
      amount: 25000.0
    streak-30-season-key:
      type: command
      command: crate give key {player} SeasonCrate 1
      asConsole: true
    streak-30-radius:
      type: command
      command: jexoneblock player grant-radius {player} 15
      asConsole: true
    streak-30-crown:
      type: item
      material: GOLDEN_HELMET
      amount: 1
      unbreakable: true
      name: <gradient:#FFD24A:#FF9A1F>Devoted Voter's Crown</gradient>
      lore:
      - <gray>Worn only by those who never missed a day.
      - ''
      - <#94A3B8>Unbreakable</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>Yes</#F1F5F9>
      - <#94A3B8>Protection</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>V</#F1F5F9>
      - <#94A3B8>Aqua Affinity</#94A3B8> <dark_gray>|</dark_gray> <#F1F5F9>V</#F1F5F9>
      - ''
      - <#FBBF24>Streak milestone | Day 30</#FBBF24>
      enchantments:
        protection: 5
        aqua_affinity: 5
      glow: true
  '60':
    streak-60-xp:
      type: xp
      amount: 1200
    streak-60-coins:
      type: currency
      currency: coins
      amount: 25000.0
    streak-60-radius:
      type: command
      command: jexoneblock player grant-radius {player} 10
      asConsole: true
    streak-60-vote-keys:
      type: command
      command: crate give key {player} VoteCrate 10
      asConsole: true
    streak-60-pass:
