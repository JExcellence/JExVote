      describe: reward_describe.custom.sigil-pass
  '90':
    streak-90-xp:
      type: xp
      amount: 1500
    streak-90-coins:
      type: currency
      currency: coins
      amount: 25000.0
    streak-90-radius:
      type: command
      command: jexoneblock player grant-radius {player} 10
      asConsole: true
    streak-90-void-keys:
      type: command
      command: crate give key {player} VoidCrate 3
      asConsole: true
    streak-90-vote-keys:
      type: command
      command: crate give key {player} VoteCrate 5
      asConsole: true
    streak-90-diamonds:
      type: item
      material: DIAMOND
      amount: 16
  '120':
    streak-120-xp:
      type: xp
      amount: 2000
    streak-120-coins:
      type: currency
      currency: coins
      amount: 25000.0
    streak-120-radius:
      type: command
      command: jexoneblock player grant-radius {player} 10
      asConsole: true
    streak-120-void-keys:
